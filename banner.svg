<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050510"/>
      <stop offset="50%" style="stop-color:#0e0028"/>
      <stop offset="100%" style="stop-color:#150020"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff2d78"/>
      <stop offset="50%" style="stop-color:#c850f0"/>
      <stop offset="100%" style="stop-color:#4f8ef7"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff2d78;stop-opacity:0"/>
      <stop offset="25%" style="stop-color:#ff2d78;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#4f8ef7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4f8ef7;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="orbL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff2d78;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#ff2d78;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="orbR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8ef7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#4f8ef7;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="orbC" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#c850f0;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#c850f0;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="subtleglow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="900" height="220" fill="url(#bg)" rx="18"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="55" x2="900" y2="55"/>
    <line x1="0" y1="110" x2="900" y2="110"/>
    <line x1="0" y1="165" x2="900" y2="165"/>
    <line x1="112" y1="0" x2="112" y2="220"/>
    <line x1="225" y1="0" x2="225" y2="220"/>
    <line x1="337" y1="0" x2="337" y2="220"/>
    <line x1="450" y1="0" x2="450" y2="220"/>
    <line x1="562" y1="0" x2="562" y2="220"/>
    <line x1="675" y1="0" x2="675" y2="220"/>
    <line x1="787" y1="0" x2="787" y2="220"/>
  </g>

  <!-- Ambient glow orbs -->
  <ellipse cx="130" cy="110" rx="180" ry="140" fill="url(#orbL)"/>
  <ellipse cx="770" cy="100" rx="190" ry="150" fill="url(#orbR)"/>
  <ellipse cx="450" cy="180" rx="220" ry="90" fill="url(#orbC)"/>

  <!-- Star particles -->
  <circle cx="55" cy="28" r="1.2" fill="#ff2d78" opacity="0.8"/>
  <circle cx="170" cy="18" r="0.8" fill="#c850f0" opacity="0.6"/>
  <circle cx="290" cy="35" r="1.4" fill="#4f8ef7" opacity="0.7"/>
  <circle cx="430" cy="22" r="0.9" fill="#ff2d78" opacity="0.5"/>
  <circle cx="590" cy="14" r="1.2" fill="#c850f0" opacity="0.7"/>
  <circle cx="720" cy="32" r="0.8" fill="#4f8ef7" opacity="0.6"/>
  <circle cx="845" cy="19" r="1.3" fill="#ff2d78" opacity="0.5"/>
  <circle cx="880" cy="65" r="0.9" fill="#c850f0" opacity="0.6"/>
  <circle cx="22" cy="160" r="1.1" fill="#4f8ef7" opacity="0.5"/>
  <circle cx="78" cy="195" r="0.8" fill="#ff2d78" opacity="0.4"/>
  <circle cx="810" cy="185" r="1.2" fill="#c850f0" opacity="0.5"/>
  <circle cx="862" cy="155" r="0.7" fill="#4f8ef7" opacity="0.6"/>
  <circle cx="380" cy="200" r="1.0" fill="#ff2d78" opacity="0.4"/>

  <!-- Corner brackets -->
  <path d="M18 18 L55 18 M18 18 L18 55" stroke="#ff2d78" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M882 18 L845 18 M882 18 L882 55" stroke="#4f8ef7" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M18 202 L55 202 M18 202 L18 165" stroke="#4f8ef7" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M882 202 L845 202 M882 202 L882 165" stroke="#ff2d78" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9"/>

  <!-- Top eyebrow -->
  <text x="450" y="50" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#c850f0" letter-spacing="5" opacity="0.85">✦  AI · FULL-STACK · OPEN SOURCE  ✦</text>

  <!-- Main name -->
  <text x="450" y="112" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="50" font-weight="900"
        fill="url(#nameGrad)"
        filter="url(#glow)"
        letter-spacing="1.5">Shameer Meerambigari</text>

  <!-- Divider -->
  <rect x="210" y="124" width="480" height="1.5" fill="url(#lineGrad)" rx="1"/>

  <!-- Subtitle -->
  <text x="450" y="152" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="15.5" font-weight="300"
        fill="#ddd0ff" letter-spacing="2"
        filter="url(#subtleglow)">B.Tech AIML  ·  Full-Stack Developer  ·  AI Engineer</text>

  <!-- Award pill -->
  <rect x="298" y="167" width="304" height="26" rx="13"
        fill="none" stroke="url(#lineGrad)" stroke-width="1" opacity="0.5"/>
  <text x="450" y="185" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="11.5" fill="#ffd060" letter-spacing="0.5" opacity="0.95">🏆  Best AI Project  ·  AI Excellence Cup  ·  Season 8</text>
</svg>
